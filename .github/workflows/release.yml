name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release --locked
      - run: Copy-Item target/release/bilinkers.exe bilinkers-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: bilinkers-windows-x64.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: cargo build --release --locked --target aarch64-apple-darwin
      - run: cargo build --release --locked --target x86_64-apple-darwin
      - name: Package universal dmg
        run: |
          mkdir dmg
          lipo -create -output dmg/bilinkers \
            target/aarch64-apple-darwin/release/bilinkers \
            target/x86_64-apple-darwin/release/bilinkers
          cp .env.example dmg/
          hdiutil create -volname Bilinkers -srcfolder dmg -format UDZO bilinkers-macos-universal.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: bilinkers-macos-universal.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes bilinkers-windows-x64.exe bilinkers-macos-universal.dmg
        env:
          GH_TOKEN: ${{ github.token }}
