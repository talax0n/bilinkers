name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - run: Copy-Item target/release/bilinkers.exe bilinkers-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: bilinkers-windows-x64.exe

  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/bilinkers

  dmg:
    needs: macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-*
      - name: Package universal dmg
        run: |
          mkdir dmg
          lipo -create -output dmg/bilinkers \
            macos-aarch64-apple-darwin/bilinkers \
            macos-x86_64-apple-darwin/bilinkers
          chmod +x dmg/bilinkers
          cp .env.example dmg/
          hdiutil create -volname Bilinkers -srcfolder dmg -format UDZO bilinkers-macos-universal.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: bilinkers-macos-universal.dmg

  release:
    if: github.ref == 'refs/heads/main'
    needs: [windows, dmg]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find an unreleased Cargo.toml version
        id: version
        run: |
          tag="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "$tag is already released"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.version.outputs.new == 'true'
        uses: actions/download-artifact@v4
        with:
          name: windows
      - if: steps.version.outputs.new == 'true'
        uses: actions/download-artifact@v4
        with:
          name: dmg
      - if: steps.version.outputs.new == 'true'
        run: gh release create "${{ steps.version.outputs.tag }}" --target "$GITHUB_SHA" --generate-notes bilinkers-windows-x64.exe bilinkers-macos-universal.dmg
        env:
          GH_TOKEN: ${{ github.token }}
